<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Original stylised "nice guy" mark: bowl cut, thick brows, sparkling grin,
       green jumpsuit with an orange collar. Transparent background so it sits on
       light and dark browser tabs alike. -->

  <!-- shoulders: green jumpsuit, orange collar -->
  <path d="M6 64C6 55 17 48 32 48s26 7 26 16z" fill="#1E7B3C"/>
  <path d="M6 64C6 55 17 48 32 48s26 7 26 16" fill="none" stroke="#E8862B" stroke-width="2.6"/>

  <!-- face -->
  <ellipse cx="32" cy="30" rx="17" ry="19" fill="#F3C79E"/>

  <!-- bowl cut: dome on top, blunt fringe, side flaps -->
  <path d="M12 26a20 20 0 0 1 40 0v12h-6V22H18v16h-6z" fill="#171717"/>

  <!-- the eyebrows -->
  <rect x="15.5" y="23.5" width="13.5" height="5" rx="2.5" fill="#171717"/>
  <rect x="35" y="23.5" width="13.5" height="5" rx="2.5" fill="#171717"/>

  <!-- eyes -->
  <circle cx="24" cy="35" r="2.4" fill="#171717"/>
  <circle cx="40" cy="35" r="2.4" fill="#171717"/>

  <!-- grin -->
  <path d="M23 40q9 7.5 18 0z" fill="#FFFFFF" stroke="#171717" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- ping! (gold so it reads against a light tab too) -->
  <path d="M56 4l1.7 4.3L62 10l-4.3 1.7L56 16l-1.7-4.3L50 10l4.3-1.7z" fill="#FFC63F"/>
</svg>
